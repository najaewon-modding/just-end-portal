name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release request
        id: release
        shell: bash
        run: |
          VERSION=$(grep '^version=' .github/release-request | cut -d= -f2-)
          TARGET=$(grep '^target=' .github/release-request | cut -d= -f2-)
          test -n "$VERSION"
          test -n "$TARGET"
          cp ".github/release-notes/${VERSION}.md" /tmp/release-notes.md
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout release target
        run: git checkout "${{ steps.release.outputs.target }}"

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release JAR
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          gh release create "v${VERSION}" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Just End Portal ${VERSION}" --notes-file /tmp/release-notes.md
