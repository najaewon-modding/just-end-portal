name: Release

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release request
        id: release
        shell: bash
        run: |
          VERSION=$(grep '^version=' .github/release-request | cut -d= -f2-)
          TARGET=$(grep '^target=' .github/release-request | cut -d= -f2-)
          MODE=$(grep '^mode=' .github/release-request | cut -d= -f2- || true)
          MODE=${MODE:-release}
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Cancel existing release
        if: steps.release.outputs.mode == 'cancel'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes

      - name: Prepare release notes
        if: steps.release.outputs.mode != 'cancel'
        run: cp ".github/release-notes/${{ steps.release.outputs.version }}.md" /tmp/release-notes.md

      - name: Checkout release target
        if: steps.release.outputs.mode != 'cancel'
        run: |
          test -n "${{ steps.release.outputs.target }}"
          git checkout "${{ steps.release.outputs.target }}"

      - name: Setup JDK 25
        if: steps.release.outputs.mode != 'cancel'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.release.outputs.mode != 'cancel'
        uses: gradle/actions/setup-gradle@v4

      - name: Build release JAR
        if: steps.release.outputs.mode != 'cancel'
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Create GitHub release
        if: steps.release.outputs.mode != 'cancel'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          gh release create "v${VERSION}" "$JAR" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --title "Just End Portal ${VERSION}" --notes-file /tmp/release-notes.md
