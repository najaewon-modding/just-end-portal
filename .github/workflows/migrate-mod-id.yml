name: Migrate Mod ID

on:
  push:
    branches: [main]
    paths:
      - '.github/mod-id-migration-request'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Migrate namespace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = 'justendportal'
          new = 'njw_just_end_portal'

          p = Path('gradle.properties')
          text = p.read_text()
          text = text.replace('mod_id=justendportal', 'mod_id=njw_just_end_portal')
          p.write_text(text)

          root = Path('src/main/java/net/njw/justendportal')
          for p in root.rglob('*.java'):
              lines = p.read_text().splitlines(keepends=True)
              out = []
              for line in lines:
                  stripped = line.lstrip()
                  if stripped.startswith('package net.njw.justendportal') or stripped.startswith('import net.njw.justendportal'):
                      out.append(line)
                  else:
                      out.append(line.replace(old, new))
              text = ''.join(out).replace('Commands.literal("njw_just_end_portal")', 'Commands.literal("justendportal")')
              p.write_text(text)

          for base in [Path('src/main/resources'), Path('src/generated/resources')]:
              if not base.exists():
                  continue
              for p in list(base.rglob('*')):
                  if p.is_file():
                      try:
                          text = p.read_text()
                      except UnicodeDecodeError:
                          continue
                      if old in text:
                          p.write_text(text.replace(old, new))
          PY

          for base in src/main/resources src/generated/resources; do
            if [ -d "$base/assets/justendportal" ]; then
              mkdir -p "$base/assets"
              git mv "$base/assets/justendportal" "$base/assets/njw_just_end_portal"
            fi
            if [ -d "$base/data/justendportal" ]; then
              mkdir -p "$base/data"
              git mv "$base/data/justendportal" "$base/data/njw_just_end_portal"
            fi
          done

      - name: Audit namespace
        shell: bash
        run: |
          grep -q '^mod_id=njw_just_end_portal$' gradle.properties
          grep -q 'MODID = "njw_just_end_portal"' src/main/java/net/njw/justendportal/JustEndPortal.java
          test -d src/main/resources/assets/njw_just_end_portal
          test -d src/main/resources/data/njw_just_end_portal
          ! grep -RIl 'justendportal' src/main/resources/assets src/main/resources/data
          ! grep -RInE '"(item|block|message)\.justendportal\.|"justendportal_' src/main/java/net/njw/justendportal

      - name: Build migrated mod
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Commit migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Change mod ID to njw_just_end_portal'
          git push origin HEAD:main
